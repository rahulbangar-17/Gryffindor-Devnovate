services:
  - type: web
    name: hindsight-rag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: 3.11.9}
      - {key: HINDSIGHT_BASE_URL, sync: false}
      - {key: HINDSIGHT_API_KEY, sync: false}
      - {key: HINDSIGHT_BANK_ID, value: demo-user}
      - {key: LLM_API_KEY, sync: false}
      - {key: LLM_BASE_URL, value: "https://api.openai.com/v1"}
      - {key: LLM_MODEL, value: gpt-4o-mini}
      - {key: DATABASE_URL, sync: false}
      - {key: QDRANT_URL, sync: false}
      - {key: QDRANT_API_KEY, sync: false}
      - {key: FRONTEND_URL, sync: false}
